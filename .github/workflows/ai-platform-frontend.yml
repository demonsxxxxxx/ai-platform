name: ai-platform frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: projection audit, lint, build, trace
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: corepack pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install pytest pyyaml
          @'
          import re
          import subprocess
          import sys
          import tomllib
          from packaging.requirements import InvalidRequirement, Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          CANONICAL_RUFF_VERSION = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")


          def resolve_ruff_requirement(test_dependencies):
              ruff_requirements = []
              for dependency in test_dependencies:
                  try:
                      requirement = Requirement(dependency)
                  except InvalidRequirement as error:
                      raise RuntimeError(
                          f"invalid test dependency while resolving Ruff: {dependency!r}"
                      ) from error
                  if canonicalize_name(requirement.name) == "ruff":
                      ruff_requirements.append(requirement)

              if len(ruff_requirements) != 1:
                  raise RuntimeError("expected exactly one Ruff test dependency")

              ruff_requirement = ruff_requirements[0]
              specifiers = list(ruff_requirement.specifier)
              if (
                  ruff_requirement.url is not None
                  or ruff_requirement.extras
                  or ruff_requirement.marker is not None
                  or len(specifiers) != 1
              ):
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              specifier = specifiers[0]
              version = specifier.version
              if specifier.operator != "==" or not CANONICAL_RUFF_VERSION.fullmatch(version):
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              try:
                  canonical_version = str(Version(version))
              except InvalidVersion as error:
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin") from error
              if version != canonical_version or str(ruff_requirement.specifier) != f"=={version}":
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              return f"ruff=={version}"

          with open("pyproject.toml", "rb") as handle:
              test_dependencies = tomllib.load(handle)["project"]["optional-dependencies"]["test"]

          ruff_requirement = resolve_ruff_requirement(test_dependencies)

          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", ruff_requirement]
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify static frontend Python contracts
        run: python -m pytest tests/test_deploy_frontend_static.py tests/test_frontend_release_traceability.py tests/test_frontend_packaged_runtime_smoke.py tests/test_frontend_ci_workflow.py tests/test_backend_ci_workflow.py tests/test_release_authority.py tests/test_runtime_launch_script.py tests/test_source_authority_docs.py -q --basetemp .pytest-tmp

      - name: Verify static frontend deploy helper
        run: python tools/deploy_frontend_static.py --help

      - name: Verify frontend projection and build
        working-directory: frontend/web
        run: corepack pnpm run ci:verify

      - name: Record frontend release traceability
        run: python tools/frontend_release_traceability.py --format json

      - name: Record packaged frontend runtime smoke contract
        run: python tools/frontend_packaged_runtime_smoke.py --format json

  frontend-image:
    name: packaged image build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            --build-arg AI_PLATFORM_BUILD_COMMIT=${{ github.sha }} \
            --build-arg AI_PLATFORM_BUILD_DIRTY=false \
            --build-arg VITE_MCP_AUTH_SOURCE_ORIGIN=${{ vars.MCP_AUTH_SOURCE_ORIGIN }} \
            -t ai-platform-frontend:${{ github.sha }} \
            -f frontend/web/Dockerfile \
            .

      - name: Verify image build provenance
        run: |
          docker run --rm --entrypoint cat ai-platform-frontend:${{ github.sha }} /usr/share/nginx/html/ai-platform-build-provenance.json > frontend-build-provenance.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path("frontend-build-provenance.json").read_text(encoding="utf-8"))
          assert provenance["git"]["commit"] == os.getenv("GITHUB_SHA")
          assert provenance["git"]["dirty"] is False
          assert provenance["frontend_path"] == "frontend/web"
          PY

  required:
    name: frontend required
    runs-on: ubuntu-latest
    needs: [frontend, frontend-image]
    if: ${{ always() }}
    steps:
      - name: Require frontend verification and image provenance
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGE_RESULT: ${{ needs.frontend-image.result }}
        run: |
          test "$FRONTEND_RESULT" = "success"
          test "$IMAGE_RESULT" = "success"
