name: ai-platform frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_NODE_VERSION: "22.23.2"
  FRONTEND_PYTHON_VERSION: "3.13.14"

jobs:
  frontend:
    name: projection audit, lint, build, trace
    runs-on: windows-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { exit 1 }
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { exit 1 }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.FRONTEND_PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: corepack pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install pytest pyyaml
          @'
          import importlib.metadata
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          from packaging.requirements import InvalidRequirement, Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          CANONICAL_RUFF_VERSION = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")
          CANONICAL_JSONSCHEMA_VERSION = re.compile(r"[0-9]+(?:\.[0-9]+)+")


          def locked_jsonschema_version(lock_path):
              with lock_path.open("rb") as handle:
                  lock = tomllib.load(handle)
              packages = lock.get("package")
              if not isinstance(packages, list):
                  raise RuntimeError("uv.lock must contain a package list")

              jsonschema_packages = [
                  package
                  for package in packages
                  if isinstance(package, dict) and package.get("name") == "jsonschema"
              ]
              if len(jsonschema_packages) != 1:
                  raise RuntimeError("uv.lock must contain exactly one jsonschema package")

              version = jsonschema_packages[0].get("version")
              if not isinstance(version, str) or CANONICAL_JSONSCHEMA_VERSION.fullmatch(version) is None:
                  raise RuntimeError("uv.lock jsonschema version must be a canonical numeric version")
              return version


          def verify_installed_jsonschema_version(expected_version):
              try:
                  installed_version = importlib.metadata.version("jsonschema")
              except importlib.metadata.PackageNotFoundError as error:
                  raise RuntimeError("installed jsonschema distribution is missing") from error
              if installed_version != expected_version:
                  raise RuntimeError("installed jsonschema version mismatch")


          def resolve_ruff_requirement(test_dependencies):
              ruff_requirements = []
              for dependency in test_dependencies:
                  try:
                      requirement = Requirement(dependency)
                  except InvalidRequirement as error:
                      raise RuntimeError(
                          f"invalid test dependency while resolving Ruff: {dependency!r}"
                      ) from error
                  if canonicalize_name(requirement.name) == "ruff":
                      ruff_requirements.append(requirement)

              if len(ruff_requirements) != 1:
                  raise RuntimeError("expected exactly one Ruff test dependency")

              ruff_requirement = ruff_requirements[0]
              specifiers = list(ruff_requirement.specifier)
              if (
                  ruff_requirement.url is not None
                  or ruff_requirement.extras
                  or ruff_requirement.marker is not None
                  or len(specifiers) != 1
              ):
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              specifier = specifiers[0]
              version = specifier.version
              if specifier.operator != "==" or not CANONICAL_RUFF_VERSION.fullmatch(version):
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              try:
                  canonical_version = str(Version(version))
              except InvalidVersion as error:
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin") from error
              if version != canonical_version or str(ruff_requirement.specifier) != f"=={version}":
                  raise RuntimeError("Ruff test dependency must be an exact canonical version pin")

              return f"ruff=={version}"

          locked_jsonschema = locked_jsonschema_version(Path("uv.lock"))
          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  f"jsonschema=={locked_jsonschema}",
              ]
          )
          verify_installed_jsonschema_version(locked_jsonschema)

          with open("pyproject.toml", "rb") as handle:
              test_dependencies = tomllib.load(handle)["project"]["optional-dependencies"]["test"]

          ruff_requirement = resolve_ruff_requirement(test_dependencies)

          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", ruff_requirement]
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python -c "import jsonschema"

      - name: Verify static frontend Python contracts
        run: python -m pytest tests/test_deploy_frontend_static.py tests/test_frontend_release_traceability.py tests/test_frontend_packaged_runtime_smoke.py tests/test_frontend_ci_workflow.py tests/test_backend_ci_workflow.py tests/test_packaging_publish_workflow.py tests/test_release_image_manifest.py tests/test_release_authority.py tests/test_runtime_launch_script.py tests/test_source_authority_docs.py -q --basetemp .pytest-tmp

      - name: Verify static frontend deploy helper
        run: python tools/deploy_frontend_static.py --help

      - name: Verify frontend projection and build
        working-directory: frontend/web
        run: corepack pnpm run ci:verify

      - name: Record frontend release traceability
        run: python tools/frontend_release_traceability.py --format json

      - name: Record packaged frontend runtime smoke contract
        run: python tools/frontend_packaged_runtime_smoke.py --format json

  frontend-image:
    name: packaged image build
    runs-on: ubuntu-latest
    needs: frontend
    env:
      IMAGE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_SOURCE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve image source repository
        run: |
          set -euo pipefail
          image_source_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            [[ "$IMAGE_SOURCE_HEAD_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
            image_source_repository="https://github.com/${IMAGE_SOURCE_HEAD_REPOSITORY}.git"
          fi
          printf 'IMAGE_SOURCE_REPOSITORY=%s\n' "$image_source_repository" >> "$GITHUB_ENV"

      - name: Build frontend image
        run: |
          set -euo pipefail
          [[ "$IMAGE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE_COMMIT"
          docker build \
            --build-arg AI_PLATFORM_BUILD_COMMIT="$IMAGE_SOURCE_COMMIT" \
            --build-arg AI_PLATFORM_BUILD_DIRTY=false \
            --build-arg AI_PLATFORM_BUILD_REPOSITORY="$IMAGE_SOURCE_REPOSITORY" \
            -t "ai-platform-frontend:$IMAGE_SOURCE_COMMIT" \
            -f frontend/web/Dockerfile \
            .

      - name: Verify image build provenance
        run: |
          docker run --rm --entrypoint cat "ai-platform-frontend:$IMAGE_SOURCE_COMMIT" /usr/share/nginx/html/ai-platform-build-provenance.json > frontend-build-provenance.json
          docker image inspect "ai-platform-frontend:$IMAGE_SOURCE_COMMIT" > frontend-image-inspect.json
          image_id="$(docker image inspect --format '{{.Id}}' "ai-platform-frontend:$IMAGE_SOURCE_COMMIT")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'packaged_frontend_image_id=%s\n' "$image_id"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path("frontend-build-provenance.json").read_text(encoding="utf-8"))
          image = json.loads(Path("frontend-image-inspect.json").read_text(encoding="utf-8"))[0]
          labels = image["Config"]["Labels"]
          assert provenance["git"]["commit"] == os.environ["IMAGE_SOURCE_COMMIT"]
          assert provenance["git"]["dirty"] is False
          assert provenance["frontend_path"] == "frontend/web"
          assert labels["org.opencontainers.image.revision"] == os.environ["IMAGE_SOURCE_COMMIT"]
          assert labels["ai-platform.source-commit"] == os.environ["IMAGE_SOURCE_COMMIT"]
          assert labels["ai-platform.source-repository"] == os.environ["IMAGE_SOURCE_REPOSITORY"]
          assert labels["ai-platform.build-dirty"] == "false"
          assert labels["ai-platform.release-role"] == "frontend"
          PY

      - name: Verify frontend image startup
        run: |
          set -euo pipefail
          image="ai-platform-frontend:$IMAGE_SOURCE_COMMIT"
          container="ai-platform-frontend-ci"
          emit_bounded_container_diagnostic() {
            local state
            state="$(docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}}' "$container" 2>/dev/null || true)"
            printf 'frontend_container_state=%s\n' "${state:-unavailable}"
            docker logs --tail 80 "$container" 2>&1 \
              | python -c 'import re, sys; lines = sys.stdin.readlines(); patterns = (("nginx_upstream_resolution", r"nginx: \[emerg\] host not found in upstream"), ("nginx_config", r"nginx: \[emerg\]"), ("application_startup", r"^(ERROR|CRITICAL):")); signals = [name for name, pattern in patterns if any(re.search(pattern, line) for line in lines)]; print(f"frontend_redacted_container_log_tail_lines={len(lines)}"); [print(f"frontend_container_log_signal={signal}") for signal in signals] or print("frontend_container_log_signal=redacted")' \
              || true
          }
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if ! docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 \
            --env AI_PLATFORM_API_UPSTREAM=http://127.0.0.1:8020 "$image"; then
            emit_bounded_container_diagnostic
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if test "$(curl --fail --silent --show-error http://127.0.0.1:18080/healthz)" = "ok"; then
              exit 0
            fi
            sleep 1
          done
          emit_bounded_container_diagnostic
          exit 1

  required:
    name: frontend required
    runs-on: ubuntu-latest
    needs: [frontend, frontend-image]
    if: ${{ always() }}
    steps:
      - name: Require frontend verification and image provenance
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGE_RESULT: ${{ needs.frontend-image.result }}
        run: |
          test "$FRONTEND_RESULT" = "success"
          test "$IMAGE_RESULT" = "success"
