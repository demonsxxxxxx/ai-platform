name: ai-platform backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-platform-backend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.12.1"

jobs:
  backend-preflight:
    name: backend preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KNOWLEDGE_MANIFEST_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      BACKEND_PREFLIGHT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact backend preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BACKEND_PREFLIGHT_SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact backend preflight source
        run: test "$(git rev-parse HEAD)" = "$BACKEND_PREFLIGHT_SOURCE_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}

      - name: Set up uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install candidate dependencies from the lock authority
        run: |
          uv lock --check
          uv sync --locked --extra test --no-install-project

      - name: Compile backend sources
        run: python -m compileall -q app tools scripts

      - name: Enforce SSE v4 release-atomic cutover
        run: python tools/check_sse_runtime_cutover.py

      - name: Enforce External Knowledge slice manifests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if test "$KNOWLEDGE_MANIFEST_BASE_COMMIT" = "0000000000000000000000000000000000000000"; then
            uv run --locked --extra test python tools/validate_external_knowledge_slice_manifest.py
            exit 0
          fi
          uv run --locked --extra test python tools/validate_external_knowledge_slice_manifest.py \
            --base-ref "$KNOWLEDGE_MANIFEST_BASE_COMMIT" \
            --head-ref "$BACKEND_PREFLIGHT_SOURCE_COMMIT"

      - name: Validate External Knowledge manifest authority
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: uv run --locked --extra test python tools/validate_external_knowledge_slice_manifest.py

  backend-tests:
    name: backend tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: backend-preflight
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: ai_platform_ci_password
        ports:
          - "54329:5432"
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ matrix.redis_image }}
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sandbox-runtime
            postgres_image: ""
            postgres_url: ""
            redis_image: redis:7.4-alpine
            redis_url: redis://localhost:6379/15
            test_files: >-
              tests/test_claude_agent_sdk_installed_contract.py
              tests/test_claude_agent_sdk_runner.py
              tests/test_claude_agent_worker_adapter.py
              tests/test_required_tool_contract.py
              tests/test_intent_router.py
              tests/test_public_answer_stream.py
              tests/test_sandbox_executor_app.py
              tests/test_settings.py
              tests/test_sandbox_container_provider.py
              tests/test_opensandbox_live_credential_isolation.py
              tests/test_opensandbox_client_ca.py
              tests/test_sandbox_runtime.py
              tests/test_sandbox_runtime_cleanup.py
              tests/test_sandbox_runtime_evidence_script.py
              tests/test_contract.py
          - shard: repository-worker-streaming
            postgres_image: postgres:16-alpine
            postgres_url: postgresql://ai_platform:ai_platform_ci_password@127.0.0.1:54329/ai_platform
            redis_image: redis:7.4-alpine
            redis_url: redis://localhost:6379/15
            test_files: >-
              tests/test_repositories.py
              tests/test_worker_main.py
              tests/test_sse_runtime_cutover.py
              tests/test_streaming_redis.py
              tests/test_streaming_control.py
              tests/test_streaming_postgres.py
              tests/test_streaming_repository.py
              tests/test_runtime_callbacks.py
              tests/test_worker.py
              tests/test_lambchat_sse_v21.py
              tests/test_app_lifespan.py
              tests/test_runtime_launch_script.py
          - shard: model-control-plane
            postgres_image: ""
            postgres_url: ""
            redis_image: ""
            redis_url: ""
            test_files: >-
              tests/test_model_management.py
              tests/test_lambchat_frontend_compat.py::test_lambchat_model_catalog_comes_from_settings
              tests/test_lambchat_frontend_compat.py::test_lambchat_governed_model_catalog_preempts_legacy_upstream_and_preserves_raw_ids
              tests/test_execution_spec.py::test_execution_spec_preserves_raw_upstream_model_identity
              tests/test_execution_spec.py::test_execution_spec_rejects_unsafe_upstream_model_identity
              tests/test_schema.py::test_schema_adds_versioned_model_gateway_and_non_deleting_shared_catalog
          - shard: run-control-contracts
            postgres_image: ""
            postgres_url: ""
            redis_image: ""
            redis_url: ""
            test_files: >-
              tests/test_admin_run_detail.py
              tests/test_chat_selected_skill_routing.py
              tests/test_claude_agent_events.py
              tests/test_executor_reconciler.py
              tests/test_file_upload_security.py
              tests/test_issue_511_session_context_gen2.py
              tests/test_platform_multi_agent_retirement.py
              tests/test_routes.py
              tests/test_run_admission_terminalization.py
              tests/test_run_cancellation_use_case.py
              tests/test_run_control_routes.py
              tests/test_run_persistence.py
              tests/test_run_projection.py
              tests/test_sse_v3_contract_generation.py
              tests/test_sse_v4_contract_generation.py
              tests/test_streaming_contracts.py
          - shard: schema-migrations
            postgres_image: postgres:16-alpine
            postgres_url: postgresql://ai_platform:ai_platform_ci_password@127.0.0.1:54329/ai_platform
            redis_image: ""
            redis_url: ""
            test_files: >-
              tests/test_schema_migrations.py
              tests/test_schema_migrations_postgres.py
          - shard: v4-durable-streaming
            postgres_image: postgres:16-alpine
            postgres_url: postgresql://ai_platform:ai_platform_ci_password@127.0.0.1:54329/ai_platform
            redis_image: redis:7.4-alpine
            redis_url: redis://127.0.0.1:6379/15
            test_files: >-
              tests/test_streaming_v4_durable.py
              tests/test_streaming_v4_postgres_integration.py
              tests/test_streaming_v4_redis_integration.py
              tests/test_streaming_v4_transport.py
          - shard: release-governance-policy
            postgres_image: ""
            postgres_url: ""
            redis_image: ""
            redis_url: ""
            test_files: >-
              tests/test_architecture_governance.py
              tests/test_backend_ci_workflow.py
              tests/test_trusted_governance.py
              tests/test_code_governance.py
              tests/test_source_authority_docs.py
              tests/test_ci_image_scope.py
              tests/test_require_zero_junit_skips.py
              tests/test_packaging_contract.py
              tests/test_packaging_publish_workflow.py
              tests/test_trivy_failure_evidence.py
              tests/test_release_image_manifest.py
              tests/test_external_knowledge_slice_manifest.py
              tests/test_external_knowledge_architecture.py
          - shard: release-governance-authority
            postgres_image: ""
            postgres_url: ""
            redis_image: ""
            redis_url: ""
            test_files: >-
              tests/test_governance_readiness.py
              tests/test_release_authority.py
              tests/test_s75_opensandbox_transition.py
    env:
      BACKEND_TEST_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AI_PLATFORM_S0A_SCHEMA_TEST_DSN: ${{ matrix.postgres_url }}
      AI_PLATFORM_SSE_REDIS_TEST_URL: ${{ matrix.redis_url }}
    steps:
      - name: Checkout exact backend test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BACKEND_TEST_SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact backend test source
        run: |
          set -euo pipefail
          [[ "$BACKEND_TEST_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BACKEND_TEST_SOURCE_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}

      - name: Set up uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install candidate dependencies from the lock authority
        run: |
          uv lock --check
          uv sync --locked --extra test --no-install-project

      - name: Run backend test shard
        run: |
          mkdir -p .pytest-tmp
          timeout --signal=TERM --kill-after=30s 10m \
            uv run --locked --extra test python -m pytest \
              ${{ matrix.test_files }} \
              -vv \
              --tb=short \
              -o faulthandler_timeout=120 \
              --junitxml ".pytest-tmp/${{ matrix.shard }}.xml" \
              --basetemp ".pytest-tmp/${{ matrix.shard }}"
          if [[ "${{ matrix.shard }}" =~ ^(repository-worker-streaming|run-control-contracts|schema-migrations|v4-durable-streaming)$ ]]; then
            uv run --locked --extra test python tools/require_zero_junit_skips.py \
              ".pytest-tmp/${{ matrix.shard }}.xml"
          fi

  agent-skill-contracts:
    name: Agent and Skill contracts
    runs-on: ubuntu-latest
    needs: backend-preflight
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: ai_platform_ci_password
        ports:
          - "54329:5432"
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_SKILL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AI_PLATFORM_AGENT_PROFILE_TEST_DSN: postgresql://ai_platform:ai_platform_ci_password@127.0.0.1:54329/ai_platform
    steps:
      - name: Checkout exact Agent and Skill contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AGENT_SKILL_SOURCE_COMMIT }}
          persist-credentials: false

      - name: Verify exact Agent and Skill contract source
        run: |
          set -euo pipefail
          [[ "$AGENT_SKILL_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$AGENT_SKILL_SOURCE_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}

      - name: Set up uv with lock-keyed cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install candidate dependencies from the lock authority
        run: |
          uv lock --check
          uv sync --locked --extra test --no-install-project

      - name: Run Agent and Skill contract tests
        run: |
          set -euo pipefail
          mkdir -p .pytest-tmp
          timeout --signal=TERM --kill-after=30s 10m \
            uv run --locked --extra test python -m pytest \
              tests/test_agent_profile_authority.py \
              tests/test_agent_profile_lifecycle.py \
              tests/test_agent_profile_routes.py \
              tests/test_agent_profiles_postgres.py \
              tests/test_agent_profile_knowledge.py \
              tests/test_model_management_postgres.py \
              tests/test_knowledge_acl.py \
              tests/test_knowledge_application.py \
              tests/test_knowledge_control_plane.py \
              tests/test_knowledge_normalization.py \
              tests/test_knowledge_postgres.py \
              tests/test_knowledge_ragflow_retrieval.py \
              tests/test_authorized_skill_catalog.py \
              tests/test_skill_dependencies.py \
              tests/test_skill_lifecycle.py \
              tests/test_skill_registry.py \
              tests/test_skill_stager.py \
              tests/test_skill_release_policy.py \
              tests/test_chat_routes.py \
              tests/test_skills_marketplace_routes.py \
              -vv \
              --tb=short \
              -o faulthandler_timeout=120 \
              --junitxml .pytest-tmp/agent-skill-contracts.xml \
              --basetemp .pytest-tmp/agent-skill-contracts
          uv run --locked --extra test python tools/require_zero_junit_skips.py \
            .pytest-tmp/agent-skill-contracts.xml

  backend-image:
    name: packaged backend image build
    runs-on: ubuntu-latest
    needs: backend-preflight
    timeout-minutes: 30
    env:
      IMAGE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
      IMAGE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_SOURCE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine backend image impact
        id: image-scope
        run: |
          set -euo pipefail
          python tools/ci_image_scope.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --role backend \
            --base-ref "$IMAGE_BASE_COMMIT" \
            --head-ref "$IMAGE_SOURCE_COMMIT" \
            >> "$GITHUB_OUTPUT"

      - name: Report backend image build disposition
        if: steps.image-scope.outputs.build != 'true'
        env:
          IMAGE_DISPOSITION: ${{ steps.image-scope.outputs.disposition }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$IMAGE_DISPOSITION" in
            not_affected)
              test "$GITHUB_EVENT_NAME" = "pull_request"
              printf 'backend_image_validation=not_affected base_commit=%s head_commit=%s\n' \
                "$IMAGE_BASE_COMMIT" "$IMAGE_SOURCE_COMMIT"
              ;;
            packaging_owned)
              test "$GITHUB_EVENT_NAME" != "pull_request"
              printf 'backend_image_build=delegated owner=ai-platform-packaging-publish source_commit=%s\n' \
                "$IMAGE_SOURCE_COMMIT"
              ;;
            *)
              printf 'backend_image_build=failed reason=unexpected_disposition\n' >&2
              exit 1
              ;;
          esac

      - name: Resolve image source repository
        if: steps.image-scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          image_source_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            [[ "$IMAGE_SOURCE_HEAD_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
            image_source_repository="https://github.com/${IMAGE_SOURCE_HEAD_REPOSITORY}.git"
          fi
          printf 'IMAGE_SOURCE_REPOSITORY=%s\n' "$image_source_repository" >> "$GITHUB_ENV"

      - name: Build backend image
        if: steps.image-scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          [[ "$IMAGE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE_COMMIT"
          docker build \
            --build-arg AI_PLATFORM_BUILD_COMMIT="$IMAGE_SOURCE_COMMIT" \
            --build-arg AI_PLATFORM_BUILD_DIRTY=false \
            --build-arg AI_PLATFORM_BUILD_REPOSITORY="$IMAGE_SOURCE_REPOSITORY" \
            -t "ai-platform-backend:$IMAGE_SOURCE_COMMIT" \
            -f Dockerfile \
            .

      - name: Block fixable backend image vulnerabilities
        if: steps.image-scope.outputs.build == 'true'
        env:
          TRIVY_LIST_ALL_PKGS: 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ai-platform-backend:${{ env.IMAGE_SOURCE_COMMIT }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          version: v0.70.0

      - name: Verify backend image runtime contract
        if: steps.image-scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          image="ai-platform-backend:$IMAGE_SOURCE_COMMIT"
          inspect_file="$RUNNER_TEMP/backend-image-inspect.json"
          docker image inspect "$image" > "$inspect_file"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'packaged_backend_image_id=%s\n' "$image_id"
          IMAGE_INSPECT_FILE="$inspect_file" python - <<'PY'
          import json
          import os
          from pathlib import Path

          image = json.loads(Path(os.environ["IMAGE_INSPECT_FILE"]).read_text(encoding="utf-8"))[0]
          config = image["Config"]
          labels = config["Labels"]
          expected_commit = os.environ["IMAGE_SOURCE_COMMIT"]
          expected_repository = os.environ["IMAGE_SOURCE_REPOSITORY"]
          assert config["User"] == "10001:10001"
          assert config["Entrypoint"] == ["/app/docker-entrypoint.sh"]
          assert labels["org.opencontainers.image.revision"] == expected_commit
          assert labels["ai-platform.source-commit"] == expected_commit
          assert labels["ai-platform.source-repository"] == expected_repository
          assert labels["ai-platform.build-dirty"] == "false"
          assert labels["ai-platform.release-role"] == "backend"
          PY
          docker run --rm --env IMAGE_SOURCE_COMMIT="$IMAGE_SOURCE_COMMIT" "$image" sh -eu -c '
            test "$(id -u):$(id -g)" = "10001:10001"
            test -x /app/docker-entrypoint.sh
            test "$(cat /app/.ai-platform-source-revision)" = "$IMAGE_SOURCE_COMMIT"
            python -c "import app.main, claude_agent_sdk; assert callable(app.main.create_app)"
          '

      - name: Verify backend image startup
        if: steps.image-scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          image="ai-platform-backend:$IMAGE_SOURCE_COMMIT"
          container="ai-platform-backend-ci"
          emit_bounded_container_diagnostic() {
            local state
            state="$(docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}}' "$container" 2>/dev/null || true)"
            printf 'backend_container_state=%s\n' "${state:-unavailable}"
            docker logs --tail 80 "$container" 2>&1 \
              | python -c 'import re, sys; lines = sys.stdin.readlines(); patterns = (("nginx_upstream_resolution", r"nginx: \[emerg\] host not found in upstream"), ("nginx_config", r"nginx: \[emerg\]"), ("application_startup", r"^(ERROR|CRITICAL):")); signals = [name for name, pattern in patterns if any(re.search(pattern, line) for line in lines)]; print(f"backend_redacted_container_log_tail_lines={len(lines)}"); [print(f"backend_container_log_signal={signal}") for signal in signals] or print("backend_container_log_signal=redacted")' \
              || true
          }
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          session_secret="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          if ! docker run --detach --name "$container" \
            --env AI_SESSION_SECRET="$session_secret" \
            --publish 127.0.0.1:18020:8020 \
            "$image"; then
            emit_bounded_container_diagnostic
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18020/api/ai/health > "$RUNNER_TEMP/backend-health.json"; then
              BACKEND_HEALTH_FILE="$RUNNER_TEMP/backend-health.json" python -c 'import json, os; from pathlib import Path; assert json.loads(Path(os.environ["BACKEND_HEALTH_FILE"]).read_text(encoding="utf-8"))["status"] == "ok"'
              exit 0
            fi
            sleep 1
          done
          emit_bounded_container_diagnostic
          exit 1

  required:
    name: backend required
    runs-on: ubuntu-latest
    needs: [backend-preflight, backend-tests, agent-skill-contracts, backend-image]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require backend, Agent/Skill, and packaged image acceptance
        env:
          PREFLIGHT_RESULT: ${{ needs.backend-preflight.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          AGENT_SKILL_RESULT: ${{ needs.agent-skill-contracts.result }}
          IMAGE_RESULT: ${{ needs.backend-image.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$BACKEND_TESTS_RESULT" = "success"
          test "$AGENT_SKILL_RESULT" = "success"
          test "$IMAGE_RESULT" = "success"
