name: ai-platform backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.12.1"

jobs:
  sandbox-provider:
    name: backend tests and governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}

      - name: Install trusted-base governance dependency
        run: python -m pip install ruff==0.11.13

      - name: Run code governance
        if: github.event_name == 'pull_request'
        env:
          GOVERNANCE_PR_NUMBER: ${{ github.event.number }}
          GOVERNANCE_BASE_REF: ${{ github.event.pull_request.base.sha }}
          GOVERNANCE_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          GOVERNANCE_FETCH_TOKEN: ${{ github.token }}
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          [[ "$GOVERNANCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GOVERNANCE_BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOVERNANCE_HEAD_REF" =~ ^[0-9a-f]{40}$ ]]
          GOVERNANCE_PULL_REF="refs/remotes/origin/pull/$GOVERNANCE_PR_NUMBER/head"
          GOVERNANCE_FETCH_BASIC="$(printf 'x-access-token:%s' "$GOVERNANCE_FETCH_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$GOVERNANCE_FETCH_BASIC"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $GOVERNANCE_FETCH_BASIC" fetch --no-tags origin "+refs/pull/$GOVERNANCE_PR_NUMBER/head:$GOVERNANCE_PULL_REF"
          unset GOVERNANCE_FETCH_TOKEN GOVERNANCE_FETCH_BASIC
          test "$(git rev-parse "$GOVERNANCE_PULL_REF^{commit}")" = "$GOVERNANCE_HEAD_REF"
          git cat-file -e "$GOVERNANCE_BASE_REF^{commit}"
          git cat-file -e "$GOVERNANCE_HEAD_REF^{commit}"
          test "$(git rev-parse "$GOVERNANCE_BASE_REF^{commit}")" = "$GOVERNANCE_BASE_REF"
          test "$(git rev-parse "$GOVERNANCE_HEAD_REF^{commit}")" = "$GOVERNANCE_HEAD_REF"
          git merge-base --is-ancestor "$GOVERNANCE_BASE_REF" "$GOVERNANCE_HEAD_REF"
          GOVERNANCE_BASE_WORKTREE="$RUNNER_TEMP/code-governance-base"
          GOVERNANCE_HEAD_WORKTREE="$RUNNER_TEMP/code-governance-head"
          git worktree add --detach "$GOVERNANCE_BASE_WORKTREE" "$GOVERNANCE_BASE_REF"
          git worktree add --detach "$GOVERNANCE_HEAD_WORKTREE" "$GOVERNANCE_HEAD_REF"
          (
            cd "$GOVERNANCE_HEAD_WORKTREE"
            python -P "$GOVERNANCE_BASE_WORKTREE/tools/code_governance.py" check \
              --base-ref "$GOVERNANCE_BASE_REF" \
              --head-ref "$GOVERNANCE_HEAD_REF" \
              --format text
          )

      - name: Checkout validated pull request head for existing checks
        if: github.event_name == 'pull_request'
        env:
          VALIDATED_PR_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_PR_HEAD_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "$VALIDATED_PR_HEAD_REF^{commit}")" = "$VALIDATED_PR_HEAD_REF"
          git checkout --detach "$VALIDATED_PR_HEAD_REF"
          test "$(git rev-parse HEAD)" = "$VALIDATED_PR_HEAD_REF"

      - name: Install candidate dependencies from the lock authority
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          uv sync --locked --extra test --no-install-project

      - name: Compile backend sources
        run: python -m compileall -q app tools scripts

      - name: Enforce SSE v2.1 release-atomic cutover
        run: python tools/check_sse_runtime_cutover.py

      - name: Run sandbox provider targeted tests
        run: |
          uv run --locked --extra test python -m pytest \
            tests/test_sandbox_container_provider.py \
            tests/test_sandbox_runtime.py \
            tests/test_sandbox_runtime_cleanup.py \
            tests/test_sandbox_runtime_211_script.py \
            tests/test_b2_sandbox_readiness.py \
            tests/test_repositories.py \
            tests/test_backend_ci_workflow.py \
            tests/test_s72_release_contract.py \
            tests/test_packaging_publish_workflow.py \
            tests/test_trivy_failure_evidence.py \
            tests/test_release_image_manifest.py \
            tests/test_governance_readiness.py \
            tests/test_release_authority.py \
            tests/test_contract.py \
            tests/test_worker_main.py \
            tests/test_sse_runtime_cutover.py tests/test_streaming_redis.py tests/test_streaming_control.py tests/test_streaming_postgres.py tests/test_streaming_repository.py tests/test_runtime_callbacks.py tests/test_worker.py tests/test_lambchat_sse_v21.py tests/test_runtime_launch_script.py \
            -q \
            --basetemp .pytest-tmp

  backend-image:
    name: packaged backend image build
    runs-on: ubuntu-latest
    needs: sandbox-provider
    env:
      IMAGE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_SOURCE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve image source repository
        run: |
          set -euo pipefail
          image_source_repository="https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            [[ "$IMAGE_SOURCE_HEAD_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
            image_source_repository="https://github.com/${IMAGE_SOURCE_HEAD_REPOSITORY}.git"
          fi
          printf 'IMAGE_SOURCE_REPOSITORY=%s\n' "$image_source_repository" >> "$GITHUB_ENV"

      - name: Build backend image
        run: |
          set -euo pipefail
          [[ "$IMAGE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE_COMMIT"
          docker build \
            --build-arg AI_PLATFORM_BUILD_COMMIT="$IMAGE_SOURCE_COMMIT" \
            --build-arg AI_PLATFORM_BUILD_DIRTY=false \
            --build-arg AI_PLATFORM_BUILD_REPOSITORY="$IMAGE_SOURCE_REPOSITORY" \
            -t "ai-platform-backend:$IMAGE_SOURCE_COMMIT" \
            -f Dockerfile \
            .

      - name: Verify backend image runtime contract
        run: |
          set -euo pipefail
          image="ai-platform-backend:$IMAGE_SOURCE_COMMIT"
          inspect_file="$RUNNER_TEMP/backend-image-inspect.json"
          docker image inspect "$image" > "$inspect_file"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'packaged_backend_image_id=%s\n' "$image_id"
          IMAGE_INSPECT_FILE="$inspect_file" python - <<'PY'
          import json
          import os
          from pathlib import Path

          image = json.loads(Path(os.environ["IMAGE_INSPECT_FILE"]).read_text(encoding="utf-8"))[0]
          config = image["Config"]
          labels = config["Labels"]
          expected_commit = os.environ["IMAGE_SOURCE_COMMIT"]
          expected_repository = os.environ["IMAGE_SOURCE_REPOSITORY"]
          assert config["User"] == "10001:10001"
          assert config["Entrypoint"] == ["/app/docker-entrypoint.sh"]
          assert labels["org.opencontainers.image.revision"] == expected_commit
          assert labels["ai-platform.source-commit"] == expected_commit
          assert labels["ai-platform.source-repository"] == expected_repository
          assert labels["ai-platform.build-dirty"] == "false"
          assert labels["ai-platform.release-role"] == "backend"
          PY
          docker run --rm --env IMAGE_SOURCE_COMMIT="$IMAGE_SOURCE_COMMIT" "$image" sh -eu -c '
            test "$(id -u):$(id -g)" = "10001:10001"
            test -x /app/docker-entrypoint.sh
            test "$(cat /app/.ai-platform-source-revision)" = "$IMAGE_SOURCE_COMMIT"
            python -c "import app.main, claude_agent_sdk; assert callable(app.main.create_app)"
          '

      - name: Verify backend image startup
        run: |
          set -euo pipefail
          image="ai-platform-backend:$IMAGE_SOURCE_COMMIT"
          container="ai-platform-backend-ci"
          emit_bounded_container_diagnostic() {
            local state
            state="$(docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}}' "$container" 2>/dev/null || true)"
            printf 'backend_container_state=%s\n' "${state:-unavailable}"
            docker logs --tail 80 "$container" 2>&1 \
              | python -c 'import re, sys; lines = sys.stdin.readlines(); patterns = (("nginx_upstream_resolution", r"nginx: \[emerg\] host not found in upstream"), ("nginx_config", r"nginx: \[emerg\]"), ("application_startup", r"^(ERROR|CRITICAL):")); signals = [name for name, pattern in patterns if any(re.search(pattern, line) for line in lines)]; print(f"backend_redacted_container_log_tail_lines={len(lines)}"); [print(f"backend_container_log_signal={signal}") for signal in signals] or print("backend_container_log_signal=redacted")' \
              || true
          }
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if ! docker run --detach --name "$container" --publish 127.0.0.1:18020:8020 "$image"; then
            emit_bounded_container_diagnostic
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18020/api/ai/health > "$RUNNER_TEMP/backend-health.json"; then
              BACKEND_HEALTH_FILE="$RUNNER_TEMP/backend-health.json" python -c 'import json, os; from pathlib import Path; assert json.loads(Path(os.environ["BACKEND_HEALTH_FILE"]).read_text(encoding="utf-8"))["status"] == "ok"'
              exit 0
            fi
            sleep 1
          done
          emit_bounded_container_diagnostic
          exit 1

  required:
    name: backend required
    runs-on: ubuntu-latest
    needs: [sandbox-provider, backend-image]
    if: ${{ always() }}
    steps:
      - name: Require backend verification and packaged image acceptance
        env:
          BACKEND_RESULT: ${{ needs.sandbox-provider.result }}
          IMAGE_RESULT: ${{ needs.backend-image.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$IMAGE_RESULT" = "success"
