name: ai-platform packaging publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm publication of the selected main commit
        required: true
        type: choice
        options:
          - PUBLISH_MAIN

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.sha }}
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  publish:
    name: publish ${{ matrix.role }} immutable image
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'PUBLISH_MAIN'))
    runs-on: ubuntu-24.04
    environment: packaging-publish
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - role: backend
            subject: ghcr.io/demonsxxxxxx/ai-platform-backend
            dockerfile: Dockerfile
            context: .
          - role: frontend
            subject: ghcr.io/demonsxxxxxx/ai-platform-frontend
            dockerfile: frontend/web/Dockerfile
            context: .
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted source identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "demonsxxxxxx/ai-platform"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1)"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.subject }}:${{ github.sha }}
          build-args: |
            AI_PLATFORM_BUILD_COMMIT=${{ github.sha }}
            AI_PLATFORM_BUILD_DIRTY=false
            AI_PLATFORM_BUILD_REPOSITORY=https://github.com/demonsxxxxxx/ai-platform.git
          provenance: false
          sbom: false

      - name: Require registry manifest digest
        env:
          MANIFEST_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_REF=%s@%s\n' "${{ matrix.subject }}" "$MANIFEST_DIGEST" >> "$GITHUB_ENV"
          printf 'MANIFEST_DIGEST=%s\n' "$MANIFEST_DIGEST" >> "$GITHUB_ENV"

      - name: Resolve authenticated linux/amd64 producer digest
        run: |
          set -euo pipefail
          oci_document="oci-${{ matrix.role }}.json"
          docker buildx imagetools inspect --raw "$IMAGE_REF" > "$oci_document"
          producer_digest="$(python tools/release_image_manifest.py resolve-producer-digest \
            --role "${{ matrix.role }}" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --image-ref "$IMAGE_REF" \
            --oci-file "$oci_document")"
          [[ "$producer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'PRODUCER_DIGEST=%s\n' "$producer_digest" >> "$GITHUB_ENV"

      - name: Configure explicit registry SBOM source
        run: |
          set -euo pipefail
          printf '%s\n' 'platform: linux/amd64' > "$RUNNER_TEMP/syft-registry-linux-amd64.yaml"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: registry:${{ matrix.subject }}@${{ steps.build.outputs.digest }}
          config: ${{ runner.temp }}/syft-registry-linux-amd64.yaml
          format: spdx-json
          output-file: sbom-${{ matrix.role }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false

      - name: Capture generated SPDX source identity
        id: spdx-source
        run: |
          set -euo pipefail
          source_hash="$(python tools/release_image_manifest.py spdx-source-hash \
            --role "${{ matrix.role }}" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --producer-digest "$PRODUCER_DIGEST" \
            --image-ref "$IMAGE_REF" \
            --sbom-file "sbom-${{ matrix.role }}.spdx.json" \
            --failure-evidence-file "spdx-binding-diagnostic-${{ matrix.role }}.json")"
          [[ "$source_hash" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$source_hash" >> "$GITHUB_OUTPUT"

      - name: Upload untrusted SPDX binding diagnostic
        if: >-
          ${{ failure() && steps.spdx-source.outcome == 'failure' &&
          hashFiles(format('sbom-{0}.spdx.json', matrix.role)) != '' &&
          hashFiles(format('spdx-binding-diagnostic-{0}.json', matrix.role)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-spdx-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          if-no-files-found: error
          retention-days: 1
          path: |
            sbom-${{ matrix.role }}.spdx.json
            spdx-binding-diagnostic-${{ matrix.role }}.json

      - name: Bind SPDX SBOM to immutable subject
        run: |
          set -euo pipefail
          python tools/release_image_manifest.py bind-spdx \
            --role "${{ matrix.role }}" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --producer-digest "$PRODUCER_DIGEST" \
            --image-ref "$IMAGE_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --unbound-content-sha256 "${{ steps.spdx-source.outputs.sha256 }}" \
            --sbom-file "sbom-${{ matrix.role }}.spdx.json"

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.subject }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-${{ matrix.role }}.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          version: v0.70.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Attest SPDX SBOM
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.role }}.spdx.json" "$IMAGE_REF"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.subject }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image by digest
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"

      - name: Install pinned GitHub CLI
        env:
          GH_CLI_CHECKSUMS_SHA256: 61905c69ec8660f310814ec98395cdd0c2d07aabf024c597ec45813984a02334
          GH_CLI_TARBALL_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
          GH_CLI_VERSION: 2.97.0
        run: |
          set -euo pipefail
          archive_name="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive_name"
          checksums_path="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_checksums.txt"
          release_url="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
          curl --fail --silent --show-error --location \
            "$release_url/gh_${GH_CLI_VERSION}_checksums.txt" \
            --output "$checksums_path"
          printf '%s  %s\n' "$GH_CLI_CHECKSUMS_SHA256" "$checksums_path" | sha256sum -c -
          test "$(grep -F "  $archive_name" "$checksums_path")" = \
            "$GH_CLI_TARBALL_SHA256  $archive_name"
          curl --fail --silent --show-error --location \
            "$release_url/$archive_name" \
            --output "$archive_path"
          printf '%s  %s\n' "$GH_CLI_TARBALL_SHA256" "$archive_path" | sha256sum -c -
          install_root="$RUNNER_TEMP/gh-cli-$GH_CLI_VERSION"
          mkdir -p "$install_root"
          tar -xzf "$archive_path" --strip-components=1 -C "$install_root"
          gh_bin="$install_root/bin/gh"
          test -x "$gh_bin"
          actual_version="$("$gh_bin" version | sed -n '1s/^gh version \([^ ]*\) .*/\1/p')"
          test "$actual_version" = "$GH_CLI_VERSION"
          printf 'GH_CLI_BIN=%s\n' "$gh_bin" >> "$GITHUB_ENV"

      - name: Verify signature and attestations
        env:
          CERTIFICATE_IDENTITY: https://github.com/demonsxxxxxx/ai-platform/.github/workflows/ai-platform-packaging-publish.yml@refs/heads/main
          GH_CLI_BIN: ${{ env.GH_CLI_BIN }}
          GH_TOKEN: ${{ github.token }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          PROVENANCE_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$GH_CLI_BIN"
          test -n "$PROVENANCE_BUNDLE_PATH"
          cp -- "$PROVENANCE_BUNDLE_PATH" "provenance-${{ matrix.role }}.bundle.json"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > "cosign-signature-${{ matrix.role }}.json"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF" > "cosign-sbom-${{ matrix.role }}.json"
          "$GH_CLI_BIN" attestation verify "oci://$IMAGE_REF" \
            --bundle "provenance-${{ matrix.role }}.bundle.json" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERTIFICATE_IDENTITY" \
            --cert-oidc-issuer "$OIDC_ISSUER" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --source-digest "$SOURCE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "provenance-${{ matrix.role }}.verified.json"

      - name: Create subject evidence record
        env:
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_REF: ${{ steps.provenance.outputs.attestation-url }}
          SIGNATURE_IDENTITY: https://github.com/demonsxxxxxx/ai-platform/.github/workflows/ai-platform-packaging-publish.yml@refs/heads/main
        run: |
          set -euo pipefail
          test -n "$PROVENANCE_REF"
          dockerfile_sha256="$(sha256sum "${{ matrix.dockerfile }}" | awk '{print $1}')"
          python tools/release_image_manifest.py subject \
            --role "${{ matrix.role }}" \
            --source-commit "$SOURCE_COMMIT" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --dockerfile-sha256 "$dockerfile_sha256" \
            --manifest-digest "$MANIFEST_DIGEST" \
            --workflow-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sbom-ref "oci://$IMAGE_REF#sbom-spdx-attestation" \
            --sbom-file "sbom-${{ matrix.role }}.spdx.json" \
            --sbom-unbound-content-sha256 "${{ steps.spdx-source.outputs.sha256 }}" \
            --provenance-attestation-id "$PROVENANCE_ID" \
            --provenance-ref "$PROVENANCE_REF" \
            --provenance-bundle "provenance-${{ matrix.role }}.bundle.json" \
            --provenance-verification "provenance-${{ matrix.role }}.verified.json" \
            --signature-identity "$SIGNATURE_IDENTITY" \
            --signature-ref "oci://$IMAGE_REF#cosign-keyless-signature" \
            --scan-ref "github-artifact://release-image-subject-$SOURCE_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.role }}/trivy-${{ matrix.role }}.json" \
            --scan-file "trivy-${{ matrix.role }}.json" \
            --output "subject-${{ matrix.role }}.json"

      - name: Upload subject evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-subject-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.role }}
          if-no-files-found: error
          retention-days: 30
          path: |
            subject-${{ matrix.role }}.json
            sbom-${{ matrix.role }}.spdx.json
            trivy-${{ matrix.role }}.json
            cosign-signature-${{ matrix.role }}.json
            cosign-sbom-${{ matrix.role }}.json
            provenance-${{ matrix.role }}.bundle.json
            provenance-${{ matrix.role }}.verified.json

  release-manifest:
    name: release image ready manifest
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download all subject evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-subject-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true

      - name: Install pinned GitHub CLI for assembly
        env:
          GH_CLI_CHECKSUMS_SHA256: 61905c69ec8660f310814ec98395cdd0c2d07aabf024c597ec45813984a02334
          GH_CLI_TARBALL_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
          GH_CLI_VERSION: 2.97.0
        run: |
          set -euo pipefail
          archive_name="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive_name"
          checksums_path="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_checksums.txt"
          release_url="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
          curl --fail --silent --show-error --location \
            "$release_url/gh_${GH_CLI_VERSION}_checksums.txt" \
            --output "$checksums_path"
          printf '%s  %s\n' "$GH_CLI_CHECKSUMS_SHA256" "$checksums_path" | sha256sum -c -
          test "$(grep -F "  $archive_name" "$checksums_path")" = \
            "$GH_CLI_TARBALL_SHA256  $archive_name"
          curl --fail --silent --show-error --location \
            "$release_url/$archive_name" \
            --output "$archive_path"
          printf '%s  %s\n' "$GH_CLI_TARBALL_SHA256" "$archive_path" | sha256sum -c -
          install_root="$RUNNER_TEMP/gh-cli-$GH_CLI_VERSION"
          mkdir -p "$install_root"
          tar -xzf "$archive_path" --strip-components=1 -C "$install_root"
          gh_bin="$install_root/bin/gh"
          test -x "$gh_bin"
          actual_version="$("$gh_bin" version | sed -n '1s/^gh version \([^ ]*\) .*/\1/p')"
          test "$actual_version" = "$GH_CLI_VERSION"
          printf 'GH_CLI_BIN=%s\n' "$gh_bin" >> "$GITHUB_ENV"

      - name: Log in to GHCR for assembly
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reverify downloaded provenance bundles
        env:
          CERTIFICATE_IDENTITY: https://github.com/demonsxxxxxx/ai-platform/.github/workflows/ai-platform-packaging-publish.yml@refs/heads/main
          GH_CLI_BIN: ${{ env.GH_CLI_BIN }}
          GH_TOKEN: ${{ github.token }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          test -n "$GH_CLI_BIN"
          for role in backend frontend; do
            image_ref="$(python tools/release_image_manifest.py subject-target \
              --subject-record "subject-$role.json" \
              --source-commit "$GITHUB_SHA" \
              --workflow-repository "$GITHUB_REPOSITORY" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --expected-role "$role")"
            "$GH_CLI_BIN" attestation verify "$image_ref" \
              --bundle "provenance-$role.bundle.json" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$CERTIFICATE_IDENTITY" \
              --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json > "provenance-$role.assembly-verified.json"
          done

      - name: Log out of GHCR after assembly verification
        if: always()
        run: docker logout ghcr.io

      - name: Assemble and verify ready manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/release_image_manifest.py assemble \
            --source-commit "$GITHUB_SHA" \
            --repository "https://github.com/demonsxxxxxx/ai-platform.git" \
            --workflow-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-root . \
            --subject-record subject-backend.json \
            --subject-record subject-frontend.json \
            --expected-role backend \
            --expected-role frontend \
            --output release-image-manifest.json
          python tools/release_image_manifest.py verify \
            --manifest release-image-manifest.json \
            --evidence-root . \
            --expected-role backend \
            --expected-role frontend

      - name: Upload ready release image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release-image-manifest.json
            subject-*.json
            sbom-*.spdx.json
            trivy-*.json
            cosign-*.json
            provenance-*.json
