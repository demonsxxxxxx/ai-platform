services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  api:
    environment:
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EGRESS_POLICY_ENABLED: "false"
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:?set SANDBOX_EGRESS_PROOF_SIGNING_KEY}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:?set SANDBOX_RUNTIME_SUBJECT}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:?set OPENSANDBOX_DOMAIN}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:?set OPENSANDBOX_PROTOCOL}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_ATTESTATION_PATH: ${OPENSANDBOX_ATTESTATION_PATH:?set OPENSANDBOX_ATTESTATION_PATH}
      OPENSANDBOX_ATTESTATION_CONTRACT_VERSION: ${OPENSANDBOX_ATTESTATION_CONTRACT_VERSION:?set OPENSANDBOX_ATTESTATION_CONTRACT_VERSION}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL:?set OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN:?set OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN}
      OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT:?set OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT:?set OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BASE_URL: http://127.0.0.1:18043
      OPENSANDBOX_EXTERNAL_EGRESS_OPENAI_BASE_URL: http://127.0.0.1:18043/openai/v1
      OPENSANDBOX_EXTERNAL_EGRESS_ANTHROPIC_BASE_URL: http://127.0.0.1:18043/anthropic
    ports: !reset []
    networks:
      - default
      - s72_callback

  worker:
    environment:
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EGRESS_POLICY_ENABLED: "false"
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:?set SANDBOX_EGRESS_PROOF_SIGNING_KEY}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:?set SANDBOX_RUNTIME_SUBJECT}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:?set OPENSANDBOX_DOMAIN}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:?set OPENSANDBOX_PROTOCOL}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_ATTESTATION_PATH: ${OPENSANDBOX_ATTESTATION_PATH:?set OPENSANDBOX_ATTESTATION_PATH}
      OPENSANDBOX_ATTESTATION_CONTRACT_VERSION: ${OPENSANDBOX_ATTESTATION_CONTRACT_VERSION:?set OPENSANDBOX_ATTESTATION_CONTRACT_VERSION}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL:?set OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN:?set OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN}
      OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT:?set OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT:?set OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BASE_URL: http://127.0.0.1:18043
      OPENSANDBOX_EXTERNAL_EGRESS_OPENAI_BASE_URL: http://127.0.0.1:18043/openai/v1
      OPENSANDBOX_EXTERNAL_EGRESS_ANTHROPIC_BASE_URL: http://127.0.0.1:18043/anthropic

  s72-broker-entry:
    image: ${AI_PLATFORM_FRONTEND_IMAGE:?set AI_PLATFORM_FRONTEND_IMAGE}
    container_name: ai-platform-s72-broker-entry
    labels:
      ai-platform.source-commit: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      ai-platform.source-dirty: "false"
      ai-platform.release-owner: repo-local-compose
      ai-platform.release-role: s72-broker-entry
      ai-platform.security-domain: control-plane-broker
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-s72-colocation
      AI_PLATFORM_API_UPSTREAM: http://api:8020
      AI_PLATFORM_MODEL_UPSTREAM: ${AI_PLATFORM_MODEL_UPSTREAM:?set AI_PLATFORM_MODEL_UPSTREAM}
    ports:
      - "127.0.0.1:18043:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - s72_callback
      - s72_model_host
    volumes:
      - ./s72-broker-nginx.conf.template:/etc/nginx/templates-s72-colocation/default.conf.template:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_started

networks:
  s72_callback:
    internal: true
    labels:
      ai-platform.security-domain: callback-only
  s72_model_host:
    labels:
      ai-platform.security-domain: model-host-only
