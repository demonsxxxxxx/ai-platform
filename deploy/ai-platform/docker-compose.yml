version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - ai_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_platform} -d ${POSTGRES_DB:-ai_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-63799}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai_platform_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-platform-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai_platform_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9009}:9000"
      - "${MINIO_CONSOLE_PORT:-9010}:9001"
    volumes:
      - ai_platform_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  workspace-init:
    image: ${AI_PLATFORM_IMAGE:?set AI_PLATFORM_IMAGE}
    container_name: ai-platform-workspace-init
    user: "0:0"
    entrypoint: ["python", "-m", "app.runtime.sandbox.workspace_permissions"]
    command: []
    restart: "no"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    volumes:
      - ai_platform_sandbox_workspaces:/runtime-workspaces

  migrate:
    image: ${AI_PLATFORM_IMAGE:?set AI_PLATFORM_IMAGE}
    container_name: ai-platform-migrate
    user: "10001:10001"
    command: ["python", "-m", "app.schema_migrations", "apply"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_platform}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "2"
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${AI_PLATFORM_IMAGE:?set AI_PLATFORM_IMAGE}
    container_name: ai-platform-api
    user: "10001:10001"
    labels:
      ai-platform.source-commit: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      ai-platform.source-dirty: "false"
      ai-platform.release-owner: repo-local-compose
      ai-platform.release-role: api
    restart: unless-stopped
    environment:
      AI_PLATFORM_RUNTIME_COMMIT: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      DEPLOYMENT_ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_platform}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_MAX_WAITING: ${DATABASE_POOL_MAX_WAITING:-100}
      DATABASE_POOL_CLOSE_TIMEOUT_SECONDS: ${DATABASE_POOL_CLOSE_TIMEOUT_SECONDS:-5}
      DATASTORE_READINESS_TIMEOUT_SECONDS: ${DATASTORE_READINESS_TIMEOUT_SECONDS:-2}
      MAX_ACTIVE_WORKER_RUNS: ${MAX_ACTIVE_WORKER_RUNS:-10}
      QUEUE_TENANT_PROCESSING_LIMIT: ${QUEUE_TENANT_PROCESSING_LIMIT:-0}
      QUEUE_USER_PROCESSING_LIMIT: ${QUEUE_USER_PROCESSING_LIMIT:-0}
      QUEUE_LEASE_SCAN_LIMIT: ${QUEUE_LEASE_SCAN_LIMIT:-50}
      QUEUE_INSIGHT_SCAN_LIMIT: ${QUEUE_INSIGHT_SCAN_LIMIT:-500}
      QUEUE_LEASE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_LEASE_VISIBILITY_TIMEOUT_SECONDS:-900}
      QUEUE_DEAD_LETTER_MAX_ENTRIES: ${QUEUE_DEAD_LETTER_MAX_ENTRIES:-1000}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-60}
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ai_platform_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ai-platform-artifacts}
      PUBLIC_SKILL_FILE_OVERLAY_MAX_BYTES: ${PUBLIC_SKILL_FILE_OVERLAY_MAX_BYTES:-262144}
      ARTIFACT_RETENTION_CLEANUP_LIMIT: ${ARTIFACT_RETENTION_CLEANUP_LIMIT:-50}
      OBJECT_DELETE_BATCH_LIMIT: "${OBJECT_DELETE_BATCH_LIMIT:-${ARTIFACT_RETENTION_CLEANUP_LIMIT:-50}}"
      OBJECT_DELETE_MAX_ATTEMPTS: "${OBJECT_DELETE_MAX_ATTEMPTS:-${ARTIFACT_OBJECT_DELETE_MAX_ATTEMPTS:-5}}"
      OBJECT_DELETE_RETRY_BASE_SECONDS: "${OBJECT_DELETE_RETRY_BASE_SECONDS:-${ARTIFACT_OBJECT_DELETE_RETRY_BASE_SECONDS:-60}}"
      OBJECT_DELETE_RETRY_CAP_SECONDS: "${OBJECT_DELETE_RETRY_CAP_SECONDS:-${ARTIFACT_OBJECT_DELETE_RETRY_CAP_SECONDS:-3600}}"
      RUN_EVENT_RETENTION_DAYS: ${RUN_EVENT_RETENTION_DAYS:-0}
      CONTEXT_SNAPSHOT_RETENTION_DAYS: ${CONTEXT_SNAPSHOT_RETENTION_DAYS:-0}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-0}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-0}
      TRUSTED_PRINCIPAL_SECRET: ${TRUSTED_PRINCIPAL_SECRET:?set TRUSTED_PRINCIPAL_SECRET}
      FRONTEND_POC_AUTH_ENABLED: ${FRONTEND_POC_AUTH_ENABLED:-false}
      EXISTING_AUTH_BASE_URL: ${EXISTING_AUTH_BASE_URL:?set EXISTING_AUTH_BASE_URL}
      EXISTING_USER_INFO_BASE_URL: ${EXISTING_USER_INFO_BASE_URL:?set EXISTING_USER_INFO_BASE_URL}
      EXISTING_AUTH_TIMEOUT_SECONDS: ${EXISTING_AUTH_TIMEOUT_SECONDS:-15}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set CORS_ALLOW_ORIGINS to the browser-visible frontend origin}
      AI_SESSION_SECRET: ${AI_SESSION_SECRET:?set AI_SESSION_SECRET}
      AI_SESSION_COOKIE_NAME: ${AI_SESSION_COOKIE_NAME:-ai_platform_session}
      AI_SESSION_COOKIE_SECURE: ${AI_SESSION_COOKIE_SECURE:-false}
      AI_SESSION_MAX_AGE_SECONDS: "86400"
      AUTH_CONTEXT_MAX_AGE_SECONDS: "86400"
      COMPANY_AUTHORITY_FRESHNESS_SECONDS: "86400"
      MCP_CONTEXT_ENCRYPTION_KEYS_JSON: ${MCP_CONTEXT_ENCRYPTION_KEYS_JSON:?set MCP_CONTEXT_ENCRYPTION_KEYS_JSON}
      MCP_CONTEXT_CURRENT_KEY_ID: ${MCP_CONTEXT_CURRENT_KEY_ID:-current}
      MCP_GATEWAY_SERVICE_TOKEN: ${MCP_GATEWAY_SERVICE_TOKEN:?set MCP_GATEWAY_SERVICE_TOKEN}
      MCP_CACHE_INVALIDATION_TOKEN: ${MCP_CACHE_INVALIDATION_TOKEN:?set MCP_CACHE_INVALIDATION_TOKEN}
      MCP_CAPABILITY_TTL_SECONDS: ${MCP_CAPABILITY_TTL_SECONDS:-1800}
      MCP_RELAY_TIMEOUT_SECONDS: ${MCP_RELAY_TIMEOUT_SECONDS:-30}
      MCP_RELAY_MAX_RESPONSE_BYTES: ${MCP_RELAY_MAX_RESPONSE_BYTES:-1048576}
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:-openai_compatible}
      MODEL_GATEWAY_REQUEST_CONCURRENCY_LIMIT: ${MODEL_GATEWAY_REQUEST_CONCURRENCY_LIMIT:-0}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-flash}
      CLAUDE_AGENT_MODEL: ${CLAUDE_AGENT_MODEL:-deepseek-v4-flash}
      DEFAULT_MODEL_ID: ${DEFAULT_MODEL_ID:-deepseek-v4-flash}
      MODEL_CATALOG_JSON: ${MODEL_CATALOG_JSON:-}
      CLAUDE_AGENT_SDK_TIMEOUT_SECONDS: ${CLAUDE_AGENT_SDK_TIMEOUT_SECONDS:-0}
      CLAUDE_AGENT_SDK_MAX_TURNS: ${CLAUDE_AGENT_SDK_MAX_TURNS:-128}
      CLAUDE_AGENT_SDK_EFFORT: ${CLAUDE_AGENT_SDK_EFFORT:-xhigh}
      CLAUDE_AGENT_SDK_MAX_THINKING_TOKENS: ${CLAUDE_AGENT_SDK_MAX_THINKING_TOKENS:-16384}
      CLAUDE_AGENT_PERMISSION_MODE: ${CLAUDE_AGENT_PERMISSION_MODE:-dontAsk}
      CLAUDE_AGENT_ALLOWED_TOOLS: ${CLAUDE_AGENT_ALLOWED_TOOLS:-Read,Glob,LS}
      CLAUDE_AGENT_DISALLOWED_TOOLS: ${CLAUDE_AGENT_DISALLOWED_TOOLS-Write,Edit,NotebookEdit}
      CLAUDE_AGENT_WORKSPACE_ROOT: ${CLAUDE_AGENT_WORKSPACE_ROOT:-/tmp/ai-platform-agent-workspaces}
      CLAUDE_AGENT_SDK_SKILLS: ${CLAUDE_AGENT_SDK_SKILLS:-general-chat,qa-file-reviewer,baoyu-translate}
      SANDBOX_CONTAINER_PROVIDER: ${SANDBOX_CONTAINER_PROVIDER:-fake}
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EXECUTOR_IMAGE: ${SANDBOX_EXECUTOR_IMAGE:-ai-platform:local}
      SANDBOX_EXECUTOR_PUBLISHED_HOST: ${SANDBOX_EXECUTOR_PUBLISHED_HOST:-host.docker.internal}
      SANDBOX_CALLBACK_BASE_URL: ${SANDBOX_CALLBACK_BASE_URL:-http://api.sandbox.internal:8020}
      SANDBOX_CALLBACK_TOKEN: ${SANDBOX_CALLBACK_TOKEN:?set SANDBOX_CALLBACK_TOKEN}
      SANDBOX_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/tmp/ai-platform-sandbox-workspaces}
      SANDBOX_CONTAINER_START_TIMEOUT_SECONDS: ${SANDBOX_CONTAINER_START_TIMEOUT_SECONDS:-30}
      SANDBOX_CLEANUP_TIMEOUT_SECONDS: ${SANDBOX_CLEANUP_TIMEOUT_SECONDS:-30}
      SANDBOX_EXECUTOR_HEALTH_TIMEOUT_SECONDS: ${SANDBOX_EXECUTOR_HEALTH_TIMEOUT_SECONDS:-60}
      SANDBOX_EGRESS_POLICY_ENABLED: ${SANDBOX_EGRESS_POLICY_ENABLED:-false}
      SANDBOX_EGRESS_NETWORK_NAME: ${SANDBOX_EGRESS_NETWORK_NAME:-ai-platform-sandbox-egress-internal-v1}
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:-}
      SANDBOX_EGRESS_PROOF_KEY_ID: ${SANDBOX_EGRESS_PROOF_KEY_ID:-current}
      SANDBOX_EGRESS_PROOF_PREVIOUS_KEYS_JSON: ${SANDBOX_EGRESS_PROOF_PREVIOUS_KEYS_JSON:-}
      SANDBOX_CALLBACK_HOST_GATEWAY: ${SANDBOX_CALLBACK_HOST_GATEWAY:-}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-127.0.0.1:8080}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:-http}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      OPENSANDBOX_USE_SERVER_PROXY: ${OPENSANDBOX_USE_SERVER_PROXY:-false}
      OPENSANDBOX_REQUEST_TIMEOUT_SECONDS: ${OPENSANDBOX_REQUEST_TIMEOUT_SECONDS:-30}
      OPENSANDBOX_TIMEOUT_SECONDS: ${OPENSANDBOX_TIMEOUT_SECONDS:-1800}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:-}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:-}
      OPENSANDBOX_EXECUTOR_ENTRYPOINT: ${OPENSANDBOX_EXECUTOR_ENTRYPOINT:-/app/docker-entrypoint.sh uvicorn}
      OPENSANDBOX_WORKSPACE_MOUNT_ENABLED: ${OPENSANDBOX_WORKSPACE_MOUNT_ENABLED:-true}
      OPENSANDBOX_STARTUP_IO_PROBE_ENABLED: ${OPENSANDBOX_STARTUP_IO_PROBE_ENABLED:-true}
      OPENSANDBOX_ALLOWED_EGRESS_HOSTS: ${OPENSANDBOX_ALLOWED_EGRESS_HOSTS:-}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN:-}
      OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT:-}
    ports:
      - "${AI_PLATFORM_API_PORT:-8020}:8020"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request; body = json.load(urllib.request.urlopen('http://127.0.0.1:8020/api/ai/ready', timeout=5)); raise SystemExit(0 if body.get('status') == 'ready' and body.get('runtime_commit') == os.environ['AI_PLATFORM_RUNTIME_COMMIT'] else 1)
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_platform_sandbox_workspaces:/tmp/ai-platform-sandbox-workspaces
    networks:
      default: {}
      sandbox_egress_internal_v1:
        aliases:
          - api.sandbox.internal
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ${AI_PLATFORM_IMAGE:?set AI_PLATFORM_IMAGE}
    container_name: ai-platform-worker
    user: "10001:10001"
    labels:
      ai-platform.source-commit: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      ai-platform.source-dirty: "false"
      ai-platform.release-owner: repo-local-compose
      ai-platform.release-role: worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker_main"]
    environment:
      AI_PLATFORM_RUNTIME_COMMIT: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      DEPLOYMENT_ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_platform}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_MAX_WAITING: ${DATABASE_POOL_MAX_WAITING:-100}
      DATABASE_POOL_CLOSE_TIMEOUT_SECONDS: ${DATABASE_POOL_CLOSE_TIMEOUT_SECONDS:-5}
      MAX_ACTIVE_WORKER_RUNS: ${MAX_ACTIVE_WORKER_RUNS:-10}
      QUEUE_TENANT_PROCESSING_LIMIT: ${QUEUE_TENANT_PROCESSING_LIMIT:-0}
      QUEUE_USER_PROCESSING_LIMIT: ${QUEUE_USER_PROCESSING_LIMIT:-0}
      QUEUE_LEASE_SCAN_LIMIT: ${QUEUE_LEASE_SCAN_LIMIT:-50}
      QUEUE_INSIGHT_SCAN_LIMIT: ${QUEUE_INSIGHT_SCAN_LIMIT:-500}
      QUEUE_LEASE_VISIBILITY_TIMEOUT_SECONDS: ${QUEUE_LEASE_VISIBILITY_TIMEOUT_SECONDS:-900}
      QUEUE_DEAD_LETTER_MAX_ENTRIES: ${QUEUE_DEAD_LETTER_MAX_ENTRIES:-1000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-60}
      WORKER_MAINTENANCE_INTERVAL_SECONDS: ${WORKER_MAINTENANCE_INTERVAL_SECONDS:-30}
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-64}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ai_platform_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-ai-platform-artifacts}
      PUBLIC_SKILL_FILE_OVERLAY_MAX_BYTES: ${PUBLIC_SKILL_FILE_OVERLAY_MAX_BYTES:-262144}
      TRUSTED_PRINCIPAL_SECRET: ${TRUSTED_PRINCIPAL_SECRET:?set TRUSTED_PRINCIPAL_SECRET}
      FRONTEND_POC_AUTH_ENABLED: ${FRONTEND_POC_AUTH_ENABLED:-false}
      EXISTING_AUTH_BASE_URL: ${EXISTING_AUTH_BASE_URL:?set EXISTING_AUTH_BASE_URL}
      EXISTING_USER_INFO_BASE_URL: ${EXISTING_USER_INFO_BASE_URL:?set EXISTING_USER_INFO_BASE_URL}
      EXISTING_AUTH_TIMEOUT_SECONDS: ${EXISTING_AUTH_TIMEOUT_SECONDS:-15}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set CORS_ALLOW_ORIGINS to the browser-visible frontend origin}
      AI_SESSION_SECRET: ${AI_SESSION_SECRET:?set AI_SESSION_SECRET}
      AI_SESSION_COOKIE_NAME: ${AI_SESSION_COOKIE_NAME:-ai_platform_session}
      AI_SESSION_COOKIE_SECURE: ${AI_SESSION_COOKIE_SECURE:-false}
      AI_SESSION_MAX_AGE_SECONDS: "86400"
      AUTH_CONTEXT_MAX_AGE_SECONDS: "86400"
      COMPANY_AUTHORITY_FRESHNESS_SECONDS: "86400"
      MCP_CONTEXT_ENCRYPTION_KEYS_JSON: ${MCP_CONTEXT_ENCRYPTION_KEYS_JSON:?set MCP_CONTEXT_ENCRYPTION_KEYS_JSON}
      MCP_CONTEXT_CURRENT_KEY_ID: ${MCP_CONTEXT_CURRENT_KEY_ID:-current}
      MCP_CAPABILITY_TTL_SECONDS: ${MCP_CAPABILITY_TTL_SECONDS:-1800}
      MCP_RELAY_TIMEOUT_SECONDS: ${MCP_RELAY_TIMEOUT_SECONDS:-30}
      MCP_RELAY_MAX_RESPONSE_BYTES: ${MCP_RELAY_MAX_RESPONSE_BYTES:-1048576}
      MEMORY_RETENTION_WORKER_CLEANUP_ENABLED: ${MEMORY_RETENTION_WORKER_CLEANUP_ENABLED:-true}
      MEMORY_RETENTION_WORKER_CLEANUP_INTERVAL_SECONDS: ${MEMORY_RETENTION_WORKER_CLEANUP_INTERVAL_SECONDS:-300}
      MEMORY_RETENTION_WORKER_CLEANUP_LIMIT: ${MEMORY_RETENTION_WORKER_CLEANUP_LIMIT:-200}
      DATA_RETENTION_WORKER_CLEANUP_ENABLED: ${DATA_RETENTION_WORKER_CLEANUP_ENABLED:-true}
      DATA_RETENTION_WORKER_CLEANUP_INTERVAL_SECONDS: ${DATA_RETENTION_WORKER_CLEANUP_INTERVAL_SECONDS:-300}
      ARTIFACT_RETENTION_CLEANUP_LIMIT: ${ARTIFACT_RETENTION_CLEANUP_LIMIT:-50}
      OBJECT_DELETE_BATCH_LIMIT: "${OBJECT_DELETE_BATCH_LIMIT:-${ARTIFACT_RETENTION_CLEANUP_LIMIT:-50}}"
      OBJECT_DELETE_MAX_ATTEMPTS: "${OBJECT_DELETE_MAX_ATTEMPTS:-${ARTIFACT_OBJECT_DELETE_MAX_ATTEMPTS:-5}}"
      OBJECT_DELETE_RETRY_BASE_SECONDS: "${OBJECT_DELETE_RETRY_BASE_SECONDS:-${ARTIFACT_OBJECT_DELETE_RETRY_BASE_SECONDS:-60}}"
      OBJECT_DELETE_RETRY_CAP_SECONDS: "${OBJECT_DELETE_RETRY_CAP_SECONDS:-${ARTIFACT_OBJECT_DELETE_RETRY_CAP_SECONDS:-3600}}"
      MEMORY_PHYSICAL_PURGE_LIMIT: ${MEMORY_PHYSICAL_PURGE_LIMIT:-50}
      MEMORY_PHYSICAL_PURGE_GRACE_DAYS: ${MEMORY_PHYSICAL_PURGE_GRACE_DAYS:-7}
      RUN_EVENT_RETENTION_DAYS: ${RUN_EVENT_RETENTION_DAYS:-0}
      CONTEXT_SNAPSHOT_RETENTION_DAYS: ${CONTEXT_SNAPSHOT_RETENTION_DAYS:-0}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-0}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-0}
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:-openai_compatible}
      MODEL_GATEWAY_REQUEST_CONCURRENCY_LIMIT: ${MODEL_GATEWAY_REQUEST_CONCURRENCY_LIMIT:-0}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-flash}
      CLAUDE_AGENT_MODEL: ${CLAUDE_AGENT_MODEL:-deepseek-v4-flash}
      DEFAULT_MODEL_ID: ${DEFAULT_MODEL_ID:-deepseek-v4-flash}
      MODEL_CATALOG_JSON: ${MODEL_CATALOG_JSON:-}
      CLAUDE_AGENT_SDK_ENABLED: ${WORKER_CLAUDE_AGENT_SDK_ENABLED:-false}
      CLAUDE_AGENT_SDK_TIMEOUT_SECONDS: ${CLAUDE_AGENT_SDK_TIMEOUT_SECONDS:-0}
      CLAUDE_AGENT_SDK_MAX_TURNS: ${CLAUDE_AGENT_SDK_MAX_TURNS:-128}
      CLAUDE_AGENT_SDK_EFFORT: ${CLAUDE_AGENT_SDK_EFFORT:-xhigh}
      CLAUDE_AGENT_SDK_MAX_THINKING_TOKENS: ${CLAUDE_AGENT_SDK_MAX_THINKING_TOKENS:-16384}
      CLAUDE_AGENT_PERMISSION_MODE: ${CLAUDE_AGENT_PERMISSION_MODE:-dontAsk}
      CLAUDE_AGENT_ALLOWED_TOOLS: ${CLAUDE_AGENT_ALLOWED_TOOLS:-Read,Glob,LS}
      CLAUDE_AGENT_DISALLOWED_TOOLS: ${CLAUDE_AGENT_DISALLOWED_TOOLS-Write,Edit,NotebookEdit}
      CLAUDE_AGENT_WORKSPACE_ROOT: ${CLAUDE_AGENT_WORKSPACE_ROOT:-/tmp/ai-platform-agent-workspaces}
      CLAUDE_AGENT_SDK_SKILLS: ${CLAUDE_AGENT_SDK_SKILLS:-general-chat,qa-file-reviewer,baoyu-translate}
      SANDBOX_CONTAINER_PROVIDER: ${SANDBOX_CONTAINER_PROVIDER:-fake}
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EXECUTOR_IMAGE: ${SANDBOX_EXECUTOR_IMAGE:-ai-platform:local}
      SANDBOX_EXECUTOR_PUBLISHED_HOST: ${SANDBOX_EXECUTOR_PUBLISHED_HOST:-host.docker.internal}
      SANDBOX_CALLBACK_BASE_URL: ${SANDBOX_CALLBACK_BASE_URL:-http://api.sandbox.internal:8020}
      SANDBOX_CALLBACK_TOKEN: ${SANDBOX_CALLBACK_TOKEN:?set SANDBOX_CALLBACK_TOKEN}
      SANDBOX_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/tmp/ai-platform-sandbox-workspaces}
      SANDBOX_CONTAINER_START_TIMEOUT_SECONDS: ${SANDBOX_CONTAINER_START_TIMEOUT_SECONDS:-30}
      SANDBOX_CLEANUP_TIMEOUT_SECONDS: ${SANDBOX_CLEANUP_TIMEOUT_SECONDS:-30}
      SANDBOX_EXECUTOR_HEALTH_TIMEOUT_SECONDS: ${SANDBOX_EXECUTOR_HEALTH_TIMEOUT_SECONDS:-60}
      SANDBOX_EGRESS_POLICY_ENABLED: ${SANDBOX_EGRESS_POLICY_ENABLED:-false}
      SANDBOX_EGRESS_NETWORK_NAME: ${SANDBOX_EGRESS_NETWORK_NAME:-ai-platform-sandbox-egress-internal-v1}
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:-}
      SANDBOX_EGRESS_PROOF_KEY_ID: ${SANDBOX_EGRESS_PROOF_KEY_ID:-current}
      SANDBOX_EGRESS_PROOF_PREVIOUS_KEYS_JSON: ${SANDBOX_EGRESS_PROOF_PREVIOUS_KEYS_JSON:-}
      SANDBOX_CALLBACK_HOST_GATEWAY: ${SANDBOX_CALLBACK_HOST_GATEWAY:-}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-127.0.0.1:8080}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:-http}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      OPENSANDBOX_USE_SERVER_PROXY: ${OPENSANDBOX_USE_SERVER_PROXY:-false}
      OPENSANDBOX_REQUEST_TIMEOUT_SECONDS: ${OPENSANDBOX_REQUEST_TIMEOUT_SECONDS:-30}
      OPENSANDBOX_TIMEOUT_SECONDS: ${OPENSANDBOX_TIMEOUT_SECONDS:-1800}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:-}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:-}
      OPENSANDBOX_EXECUTOR_ENTRYPOINT: ${OPENSANDBOX_EXECUTOR_ENTRYPOINT:-/app/docker-entrypoint.sh uvicorn}
      OPENSANDBOX_WORKSPACE_MOUNT_ENABLED: ${OPENSANDBOX_WORKSPACE_MOUNT_ENABLED:-true}
      OPENSANDBOX_STARTUP_IO_PROBE_ENABLED: ${OPENSANDBOX_STARTUP_IO_PROBE_ENABLED:-true}
      OPENSANDBOX_ALLOWED_EGRESS_HOSTS: ${OPENSANDBOX_ALLOWED_EGRESS_HOSTS:-}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_URL:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN: ${OPENSANDBOX_EXTERNAL_EGRESS_CAPABILITY_TOKEN:-}
      OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_GATEWAY_POLICY_SUBJECT:-}
      OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT: ${OPENSANDBOX_EXTERNAL_EGRESS_CALLBACK_BOUNDARY_SUBJECT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ai_platform_sandbox_workspaces:/tmp/ai-platform-sandbox-workspaces
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ${AI_PLATFORM_FRONTEND_IMAGE:?set AI_PLATFORM_FRONTEND_IMAGE}
    container_name: ai-platform-frontend
    labels:
      ai-platform.source-commit: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      ai-platform.source-dirty: "false"
      ai-platform.release-owner: repo-local-compose
      ai-platform.release-role: frontend
    restart: unless-stopped
    environment:
      AI_PLATFORM_API_UPSTREAM: ${AI_PLATFORM_API_UPSTREAM:-http://api:8020}
      AI_PLATFORM_FRONTEND_MAX_BODY_SIZE: ${AI_PLATFORM_FRONTEND_MAX_BODY_SIZE:-50m}
      AI_PLATFORM_FRONTEND_PROXY_READ_TIMEOUT: ${AI_PLATFORM_FRONTEND_PROXY_READ_TIMEOUT:-300s}
      AI_PLATFORM_FRONTEND_PROXY_SEND_TIMEOUT: ${AI_PLATFORM_FRONTEND_PROXY_SEND_TIMEOUT:-300s}
    ports:
      - "${AI_PLATFORM_FRONTEND_PORT:-18001}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  ai_platform_postgres:
  ai_platform_redis:
  ai_platform_minio:
  ai_platform_sandbox_workspaces:

networks:
  sandbox_egress_internal_v1:
    name: ai-platform-sandbox-egress-internal-v1
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
