services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  workspace-init:
    volumes:
      - ${SANDBOX_WORKSPACE_ROOT:?set SANDBOX_WORKSPACE_ROOT}:/runtime-workspaces

  api:
    environment:
      MODEL_CONNECTION_ENCRYPTION_KEY: ${MODEL_CONNECTION_ENCRYPTION_KEY:?set MODEL_CONNECTION_ENCRYPTION_KEY}
      MODEL_CONNECTION_ALLOWED_INTERNAL_HOSTS: ${MODEL_CONNECTION_ALLOWED_INTERNAL_HOSTS:-}
      MODEL_PROXY_INTERNAL_TOKEN: ${MODEL_PROXY_INTERNAL_TOKEN:?set MODEL_PROXY_INTERNAL_TOKEN}
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EGRESS_POLICY_ENABLED: "true"
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:?set SANDBOX_EGRESS_PROOF_SIGNING_KEY}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:-direct-opensandbox}
      OPENSANDBOX_BASE_URL: ${OPENSANDBOX_BASE_URL:?set OPENSANDBOX_BASE_URL}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:-}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_USE_SERVER_PROXY: "true"
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_EXPECTED_NETWORK_MODE: ai-platform-opensandbox-egress-internal-v1
      OPENSANDBOX_EGRESS_PROXY_URL: http://egress.opensandbox.internal:8080
    networks:
      - default
    volumes:
      - ${SANDBOX_WORKSPACE_ROOT:?set SANDBOX_WORKSPACE_ROOT}:${SANDBOX_WORKSPACE_ROOT:?set SANDBOX_WORKSPACE_ROOT}

  worker:
    environment:
      CLAUDE_AGENT_SDK_ENABLED: ${WORKER_CLAUDE_AGENT_SDK_ENABLED:?set WORKER_CLAUDE_AGENT_SDK_ENABLED}
      CLAUDE_AGENT_PERMISSION_MODE: ${CLAUDE_AGENT_PERMISSION_MODE:?set CLAUDE_AGENT_PERMISSION_MODE}
      CLAUDE_AGENT_ALLOWED_TOOLS: ${CLAUDE_AGENT_ALLOWED_TOOLS:?set CLAUDE_AGENT_ALLOWED_TOOLS}
      CLAUDE_AGENT_DISALLOWED_TOOLS: ${CLAUDE_AGENT_DISALLOWED_TOOLS:?set CLAUDE_AGENT_DISALLOWED_TOOLS}
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: governed
      SANDBOX_EGRESS_POLICY_ENABLED: "true"
      SANDBOX_EGRESS_PROOF_SIGNING_KEY: ${SANDBOX_EGRESS_PROOF_SIGNING_KEY:?set SANDBOX_EGRESS_PROOF_SIGNING_KEY}
      SANDBOX_RUNTIME_SUBJECT: ${SANDBOX_RUNTIME_SUBJECT:-direct-opensandbox}
      OPENSANDBOX_BASE_URL: ${OPENSANDBOX_BASE_URL:?set OPENSANDBOX_BASE_URL}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:-}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_USE_SERVER_PROXY: "true"
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_EXPECTED_NETWORK_MODE: ai-platform-opensandbox-egress-internal-v1
      OPENSANDBOX_EGRESS_PROXY_URL: http://egress.opensandbox.internal:8080
    networks:
      - default
    volumes:
      - ${SANDBOX_WORKSPACE_ROOT:?set SANDBOX_WORKSPACE_ROOT}:${SANDBOX_WORKSPACE_ROOT:?set SANDBOX_WORKSPACE_ROOT}

  opensandbox-egress-proxy:
    image: ${AI_PLATFORM_FRONTEND_IMAGE:?set AI_PLATFORM_FRONTEND_IMAGE}
    container_name: ai-platform-opensandbox-egress-proxy
    labels:
      ai-platform.source-commit: ${AI_PLATFORM_SOURCE_COMMIT:?set AI_PLATFORM_SOURCE_COMMIT}
      ai-platform.source-dirty: "false"
      ai-platform.release-owner: repo-local-compose
      ai-platform.release-role: opensandbox-egress-proxy
      ai-platform.security-domain: control-plane-egress
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-opensandbox
      AI_PLATFORM_API_UPSTREAM: http://api:8020
      MODEL_PROXY_INTERNAL_TOKEN: ${MODEL_PROXY_INTERNAL_TOKEN:?set MODEL_PROXY_INTERNAL_TOKEN}
    networks:
      default:
      opensandbox_egress_internal_v1:
        aliases:
          - egress.opensandbox.internal
        ipv4_address: 172.31.75.2
    volumes:
      - ./opensandbox-egress-nginx.conf.template:/etc/nginx/templates-opensandbox/default.conf.template:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755,uid=101,gid=101
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_started

networks:
  opensandbox_egress_internal_v1:
    name: ai-platform-opensandbox-egress-internal-v1
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-osb-egress
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.31.75.0/24
