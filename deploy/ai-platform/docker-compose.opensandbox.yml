services:
  api:
    environment:
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: trusted_internal
      SANDBOX_EGRESS_POLICY_ENABLED: "false"
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:?set OPENSANDBOX_DOMAIN}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:?set OPENSANDBOX_PROTOCOL}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL}
      OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL}
      OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL}

  worker:
    environment:
      SANDBOX_CONTAINER_PROVIDER: opensandbox
      SANDBOX_SECURITY_PROFILE: trusted_internal
      SANDBOX_EGRESS_POLICY_ENABLED: "false"
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:?set OPENSANDBOX_DOMAIN}
      OPENSANDBOX_PROTOCOL: ${OPENSANDBOX_PROTOCOL:?set OPENSANDBOX_PROTOCOL}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:?set OPENSANDBOX_API_KEY}
      OPENSANDBOX_EXECUTOR_IMAGE: ${OPENSANDBOX_EXECUTOR_IMAGE:?set OPENSANDBOX_EXECUTOR_IMAGE}
      OPENSANDBOX_EXECUTOR_IMAGE_DIGEST: ${OPENSANDBOX_EXECUTOR_IMAGE_DIGEST:?set OPENSANDBOX_EXECUTOR_IMAGE_DIGEST}
      OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_CALLBACK_BASE_URL}
      OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_OPENAI_BASE_URL}
      OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL: ${OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL:?set OPENSANDBOX_TRUSTED_INTERNAL_ANTHROPIC_BASE_URL}
